name: CD to AWS EC2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 after CI passes
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          missing=0
          for secret_name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required Actions secret is missing or empty: ${secret_name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build Docker image on GitHub runner
        run: docker build --tag sic-attendance:ec2 .

      - name: Reclaim unused Docker storage on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          sudo docker builder prune --all --force
          sudo docker image prune --all --force
          df -h /
          REMOTE

      - name: Stream Docker image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -o pipefail
          docker save sic-attendance:ec2 | gzip -1 | ssh \
            -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" 'gzip -dc | sudo docker load'

      - name: Migrate existing SQLite data and start Docker service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/sic
          git fetch origin main
          if git show-ref --verify --quiet refs/heads/main; then
            git checkout main
          else
            git checkout -b main origin/main
          fi
          git pull --ff-only origin main

          sudo systemctl enable --now docker
          sudo docker volume create sic_sic-data >/dev/null
          sudo docker volume create sic_sic-models >/dev/null

          if ! sudo docker run --rm --user 0 -v sic_sic-data:/data sic-attendance:ec2 \
              sh -c 'test -s /data/classroom.db'; then
            sudo systemctl stop sic
            sudo docker run --rm --user 0 \
              -v sic_sic-data:/data \
              -v /opt/sic/backend/classroom.db:/source/classroom.db:ro \
              sic-attendance:ec2 \
              sh -c 'cp /source/classroom.db /data/classroom.db && chown -R 10001:10001 /data'
          fi

          if [ -d /opt/sic/.insightface ] && \
             ! sudo docker run --rm --user 0 -v sic_sic-models:/models sic-attendance:ec2 \
               sh -c 'test -n "$(ls -A /models)"'; then
            sudo docker run --rm --user 0 \
              -v sic_sic-models:/models \
              -v /opt/sic/.insightface:/source:ro \
              sic-attendance:ec2 \
              sh -c 'cp -a /source/. /models/ && chown -R 10001:10001 /models'
          fi

          sudo systemctl disable --now sic
          sudo docker compose -p sic -f compose.yaml -f compose.ec2.yaml up -d --no-build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail 80 sic-attendance
          sudo docker compose -p sic -f compose.yaml -f compose.ec2.yaml down
          sudo systemctl enable --now sic
          exit 1
          REMOTE
